<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/responsive.css">
  <style>
    .about-section {
        margin-top: 5vh;
    }
  </style>
    <title>IEEE CEAL</title>
</head>

<body>
    <!-- Nav bar -->
    <div id="NavBar"></div>

    <!-- About Section -->
    <section class="about-section landing-page-about">
        <div class="left-column">
            <h1 id="page-title">ABOUT</h1>
            <h2 id="page-subtitle">IEEE CEAL Student Branch</h2>
        </div>
        <div class="right-column">
            <p id="page-description">
                Loading description...
            </p>
            <ul id="about-points">
                <!-- Points will be injected here -->
            </ul>
        </div>
    </section>

    <script>
    async function initAbout() {
        await window.loadPageHeader('about');
        
        // Handle custom points for about page
        try {
            const response = await fetch(`${CONFIG.API_BASE_URL}/pages/about/`);
            const data = await response.json();
            if (data.status === 'success' && data.page && data.page.extra_data && data.page.extra_data.points) {
                const pointsList = document.getElementById('about-points');
                pointsList.innerHTML = '';
                data.page.extra_data.points.forEach(point => {
                    const li = document.createElement('li');
                    li.textContent = point;
                    pointsList.appendChild(li);
                });
            }
        } catch (e) { console.error("About points load failed", e); }
    }
    document.addEventListener('DOMContentLoaded', initAbout);
    </script>

    <!-- Logo Bar -->
    <div class="bg-gray-100 py-6 px-4">
        <div id="LogoBar" class="flex flex-wrap justify-center items-center gap-4 md:gap-8 lg:gap-12 max-w-7xl mx-auto">
            <img class="h-8 sm:h-10 md:h-12 lg:h-14 object-contain" src="/logos/color/IEEE-CS_logo-color.png"
                alt="IEEE Computer Society Logo" />
            <img class="h-8 sm:h-10 md:h-12 lg:h-14 object-contain" src="/logos/color/IEEE-EMBS_Logo-color.png"
                alt="IEEE EMBS Logo" />
            <img class="h-8 sm:h-10 md:h-12 lg:h-14 object-contain" src="/logos/color/IEEE-PELS_Logo-color.png"
                alt="IEEE PELS Logo" />
            <img class="h-8 sm:h-10 md:h-12 lg:h-14 object-contain" src="/logos/color/IEEE-PES_Logo-color.png"
                alt="IEEE PES Logo" />
            <img class="h-8 sm:h-10 md:h-12 lg:h-14 object-contain" src="/logos/color/IEEE-RAS_Logo-color.png"
                alt="IEEE RAS Logo" />
            <img class="h-8 sm:h-10 md:h-12 lg:h-14 object-contain" src="/logos/color/IEEE-SPS_Logo-color.png"
                alt="IEEE SPS Logo" />
            <img class="h-8 sm:h-10 md:h-12 lg:h-14 object-contain" src="/logos/color/IEEE-WIE_logo-color.png"
                alt="IEEE WIE Logo" />
            <img class="h-8 sm:h-10 md:h-12 lg:h-14 object-contain" src="/logos/color/IEEE-IAS_Logo-color.png"
                alt="IEEE IAS Logo" />
        </div>
    </div>

    <!-- Add more sections here -->

    <!-- Footer -->
    <div id="Footer"></div>

    <script src="/config.js"></script>
    <script src="/script.js"></script>
    
    <!-- loader.js loads the navbar and footer dynamically -->
    <script src="/loader.js"></script>
</body>

</html>
