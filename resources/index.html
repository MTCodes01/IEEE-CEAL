<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resources - IEEE CEAL</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/responsive.css">
    <style>
        :root {
            --ieee-blue: #00629B;
            --ieee-dark-blue: #003057;
            --ieee-light-blue: #00B5E2;
            --accent-yellow: #FFC72C;
            --text-main: #1A202C;
            --text-muted: #718096;
            --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            background-color: #F7FAFC;
        }

        /* Hero / Search Section */
        .resources-hero {
            background: linear-gradient(135deg, var(--ieee-dark-blue) 0%, var(--ieee-blue) 100%);
            padding: 80px 20px;
            text-align: center;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .resources-hero::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('https://www.ieee.org/content/dam/ieee-org/ieee/web/org/globals/header-bg-texture.png');
            opacity: 0.1;
            pointer-events: none;
        }

        .search-container {
            max-width: 700px;
            margin: 40px auto 0;
            position: relative;
            z-index: 10;
        }

        .search-input {
            width: 100%;
            padding: 18px 25px 18px 60px;
            border-radius: 50px;
            border: none;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            font-size: 1.1rem;
            color: var(--text-main);
            outline: none;
            transition: var(--transition);
        }

        .search-input:focus {
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            transform: translateY(-2px);
        }

        .search-icon {
            position: absolute;
            left: 25px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--ieee-blue);
            font-size: 1.2rem;
        }

        /* Filter Pills */
        .filters-section {
            margin: -30px 0 50px;
            position: relative;
            z-index: 20;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            padding: 0 20px;
        }

        .filter-pill {
            background: white;
            padding: 10px 24px;
            border-radius: 50px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            color: var(--ieee-blue);
            font-weight: 600;
            cursor: pointer;
            border: 2px solid transparent;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filter-pill:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
            border-color: var(--ieee-light-blue);
        }

        .filter-pill.active {
            background: var(--ieee-blue);
            color: white;
            box-shadow: 0 8px 20px rgba(0, 98, 155, 0.3);
        }

        /* Resource Cards */
        .resource-grid {
            max-width: 1300px;
            margin: 0 auto;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
        }

        .resource-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            border: 1px solid #edf2f7;
        }

        .resource-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
        }

        .card-image-wrap {
            height: 180px;
            background: #edf2f7;
            position: relative;
            overflow: hidden;
        }

        .card-image-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: var(--transition);
        }

        .resource-card:hover .card-image-wrap img {
            transform: scale(1.05);
        }

        .card-category {
            position: absolute;
            top: 15px;
            right: 15px;
            background: var(--accent-yellow);
            color: var(--ieee-dark-blue);
            padding: 5px 12px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .card-content {
            padding: 25px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--ieee-dark-blue);
            margin-bottom: 12px;
            line-height: 1.3;
        }

        .card-meta {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 15px;
        }

        .card-desc {
            font-size: 0.95rem;
            color: #4A5568;
            margin-bottom: 25px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.6;
        }

        .card-footer {
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-access {
            background: var(--ieee-blue);
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 600;
            text-decoration: none;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-access:hover {
            background: var(--ieee-dark-blue);
            padding-right: 25px;
        }

        /* Skeleton */
        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }
        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>

<body>
    <div id="NavBar"></div>

    <section class="resources-hero landing-page-resources">
        <div class="max-w-4xl mx-auto px-4">
            <h1 id="page-title" class="text-4xl md:text-5xl font-extrabold mb-4">Member Resources</h1>
            <p id="page-subtitle" class="text-xl opacity-90 max-w-2xl mx-auto">Discover essential technical content, professional development tools, and member-exclusive benefits.</p>
            
            <div class="search-container">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="resource-search" class="search-input" placeholder="Search by title, category, or description..." oninput="handleSearch()">
            </div>
        </div>
    </section>

    <div class="filters-section" id="category-filters">
        <button class="filter-pill active" onclick="filterByCategory('all', this)">
            <i class="fa-solid fa-list-ul"></i> All Resources
        </button>
        <!-- Dynamic categories -->
    </div>

    <main class="resource-grid" id="resource-grid">
        <!-- Skeleton Loaders -->
        <div class="resource-card skeleton h-96"></div>
        <div class="resource-card skeleton h-96"></div>
        <div class="resource-card skeleton h-96"></div>
    </main>

    <div id="Footer"></div>

    <script src="/config.js"></script>
    <script src="/script.js"></script>
    <script>
        let allResources = [];
        let currentFilter = 'all';
        let searchQuery = '';

        async function loadResources() {
            const grid = document.getElementById('resource-grid');
            try {
                const res = await fetch(`${CONFIG.API_BASE_URL}/resources/`);
                const data = await res.json();
                
                if (data.status === 'success' && data.resources) {
                    allResources = data.resources;
                    
                    // Populate filters
                    const categories = [...new Set(allResources.map(r => r.category))].filter(Boolean).sort();
                    const filterContainer = document.getElementById('category-filters');
                    
                    // Clear existing categories beyond the 'All' button
                    const allBtn = filterContainer.querySelector('.filter-pill.active');
                    filterContainer.innerHTML = '';
                    filterContainer.appendChild(allBtn);

                    categories.forEach(cat => {
                        const btn = document.createElement('button');
                        btn.className = 'filter-pill';
                        btn.innerHTML = `<i class="fa-solid fa-tag"></i> ${cat}`;
                        btn.onclick = () => filterByCategory(cat, btn);
                        filterContainer.appendChild(btn);
                    });

                    renderResources();
                } else {
                    grid.innerHTML = '<div class="col-span-full py-20 text-center text-gray-500">No resources found yet.</div>';
                }
            } catch (error) {
                console.error(error);
                grid.innerHTML = '<div class="col-span-full py-20 text-center text-red-500">Failed to load resources.</div>';
            }
        }

        function renderResources() {
            const grid = document.getElementById('resource-grid');
            grid.innerHTML = '';

            const filtered = allResources.filter(res => {
                const matchesCategory = currentFilter === 'all' || res.category === currentFilter;
                const matchesSearch = !searchQuery || 
                    res.title.toLowerCase().includes(searchQuery) || 
                    (res.description || '').toLowerCase().includes(searchQuery) ||
                    res.category.toLowerCase().includes(searchQuery);
                return matchesCategory && matchesSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '<div class="col-span-full py-20 text-center text-gray-500"><i class="fa-solid fa-box-open text-4xl mb-4 block"></i> No resources match your search.</div>';
                return;
            }

            filtered.forEach(res => {
                const card = document.createElement('div');
                card.className = 'resource-card';
                card.innerHTML = `
                    <div class="card-image-wrap">
                        <img src="${res.thumbnail_url || 'https://www.ieee.org/content/dam/ieee-org/ieee/web/org/globals/ieee-logo.png'}" alt="${res.title}" onerror="this.src='https://via.placeholder.com/400x250?text=IEEE+Resource'">
                        ${res.category ? `<span class="card-category">${res.category}</span>` : ''}
                    </div>
                    <div class="card-content">
                        <h3 class="card-title">${res.title}</h3>
                        <div class="card-meta">
                            <span><i class="fa-regular fa-calendar-days mr-2"></i> ${res.date || 'Free Resource'}</span>
                        </div>
                        <p class="card-desc">${res.description || 'Access high-quality technical content and professional development materials curated for IEEE members.'}</p>
                        <div class="card-footer">
                            <a href="${res.link}" target="_blank" class="btn-access">
                                View Resource <i class="fa-solid fa-chevron-right ml-1"></i>
                            </a>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterByCategory(category, element) {
            currentFilter = category;
            document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
            element.classList.add('active');
            renderResources();
        }

        function handleSearch() {
            searchQuery = document.getElementById('resource-search').value.toLowerCase();
            renderResources();
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadResources();
            window.loadPageHeader('resources');
        });
    </script>
    <script src="/loader.js"></script>
</body>

</html>
