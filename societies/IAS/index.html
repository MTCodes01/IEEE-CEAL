<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/execom/style.css">
    <link rel="stylesheet" href="/responsive.css">
    <title id="tab-title">IEEE CEAL Society</title>
</head>
<body>
    <!-- Nav bar -->
    <div id="NavBar"></div>

    <div class="landing-page" style="background-color: var(--primary);">
        <div class="landing-content">
            <h1 id="page-title">Loading...</h1>
            <p id="page-subtitle"></p>
            <a href="#about" class="explore-btn">Read More</a>
        </div>
    </div>

    <!-- About Section -->
    <section class="about-section">
        <div class="left-column">
            <h1>ABOUT</h1>
            <h2 id="society-full-name">Society Details</h2>
        </div>
        <div class="right-column">
            <img src="" alt="Society Logo" class="society-logo" id="about-society-logo">
            <p id="society-description">
                Loading description...
            </p>
            <ul id="society-features"></ul>
        </div>
    </section>

    <!-- Stats Section -->
    <section class="stats">
        <div class="stat-box">
            <h3 class="years">0</h3>
            <p>Years</p>
        </div>
        <div class="stat-box">
            <h3 class="members">0</h3>
            <p>Members</p>
        </div>
        <div class="stat-box">
            <h3 class="projects">0</h3>
            <p>Projects</p>
        </div>
        <div class="stat-box">
            <h3 class="events">0</h3>
            <p>Events</p>
        </div>
    </section>

    <!-- Team Section (Hydrated by members.js) -->
    <section id="team" style="padding-top: 60px; min-height: 400px;"></section>

    <!-- Footer -->
    <div id="Footer"></div>

    <script src="/config.js"></script>
    <script src="../society.js"></script>
    <script src="../members.js"></script>
    <script src="/loader.js"></script>
</body>
</html>
